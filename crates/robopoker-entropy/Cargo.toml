[package]
name = "robopoker-entropy"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[features]
default = []
# Enable for testing with mollusk-svm
test-sbf = []

[dependencies]
pinocchio = "0.9"
pinocchio-pubkey = "0.3"
pinocchio-system = "0.4"

[target.'cfg(not(target_os = "solana"))'.dependencies]
sha2 = "0.10"

[dev-dependencies]
mollusk-svm = "0.10"
solana-address = "2.0"
solana-account = "3.3"
solana-instruction = "3.1"
solana-system-interface = "2.0"
